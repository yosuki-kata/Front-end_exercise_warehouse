<!--这个<!DOCTYPE html>标签是用来告诉浏览器这是个HTML文件的-->
<!DOCTYPE html>
<!--这个html标签是HTML的核心,也是这个HTML文件的最外壳-->
<html>
  <!--这个<head>标签是包括这个HTML文件的元信息-->
  <head>
    <title>test html</title> <!--比如说这个是标题标签,用于窗口的名字显示-->
    <meta charset="UTF-8"> <!--而这个是告诉浏览器这个文件是需要以什么编码格式读取的-->
  </head>
  <!--这个<body>标签里的所有内容都是实际显示在浏览器里的内容-->
  <body>
    <h1>Hello,World!</h1> <!--这个h1标签是1级标题标签,一共有6个级别,从大到小依次为h1到h6-->
    <p>yyyyyeeeeeeeeeesssssssssssss</p> <!--而这是一个段落标签,一般用于正文显示-->
    <p>
     <!--要更改文本样式的话，可以参考以下标签-->
     <b>我是粗体</b> <i>我是斜体</i> <u>我是下划线</u> <s>我是删除线</s>
    </p>
     <!--这是无序列表框架-->
    <ul> 
      <li>我是无序列表元素</li>
      <li>我们可以叠加多个,可用于列出不需要排序的一些东西</li>
      <li>我是来凑数的.jpg</li>
    </ul>
    <!--这是有序列表框架-->
    <ol>
      <li>我是有序列表元素</li>
      <li>我们也和无列表一样用着相同的标签</li>
      <li>你可以用这个框架来排列一些需要排序的东西</li>
      <li>我也是来凑数的.jpg</li>
    </ol>
    <!--记住这两个标签,ol有序,ul无序-->
    <!--下面的table标签则是表格标签,也是整个表格的框架-->
    <!--主要用于表格清单之类的场景-->
    <table border="1"> <!--也可以加上border这个属性,这个属性是可选的,会添加一个边框,里边的值可以填1~4用于调整边框的宽度-->
      <tr><!--这个tr标签全称是table row,是表格列的意思-->
        <th>列标题 1</th> <!--th标签,全称table hander,是表格列标题的意思-->
        <th>列标题 2</th>
        <th>列标题 3</th>
      </tr>
      <tr> 
        <td>我是金角大王</td> <!--这个td标签全称是table data,也就是表格内容-->
        <td>我是银角大王</td> 
        <td>我是凑数大王XD</td>
      </tr>
    </table>
  </body>
</html>
<!--记得一定要打上结尾标签,不然展示的时候有你好出糗的-->
