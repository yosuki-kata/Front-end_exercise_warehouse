<!--之前学过的内容这里不会再注释,只有新的内容才会注释解释-->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Document</title>
  </head>
  <body>
    <!--a标签，即超链接标签，常用于创建链接到其他的网页或者位置，说白了就是/tp @s '地址变量'-->
    <a href="https://www.bilibili.com"><!--href属性（重要！重要！重要！）用于定义链接到的目标,可以是其他网址url文件的路径,电子邮箱的地址,甚至手机号(话说这样真的不怕被开盒吗)-->
      这是一个超链接,指向了哔哩哔哩网页端<!--超链接的文本映射,在浏览器内可被交互,点击后会定位至该地址,一般以蓝色字体加下划线的形式展示-->
    </a><!--都写这网址了，真的不考虑进去看一会吗？-->
    <br><!--br是一个换行标签,适合给一些无法自动分行的元素分行,和\n差不多-->
    <!--target属性,决定了以什么方式打开这个网址,比如在当前标签页打开,新开标签页等,说白了就是把绿宝石放进一个已经有钻石的箱子和单独把绿宝石放在一个新的箱子里边的区别-->
    <!--这个_self属性值表示会在当前窗口或者标签页打开这个网址(也就是我上面说的把绿宝石放进有钻石的箱子里),一般可选择不写,因为默认为这个属性-->
    <a href="https://www.baidu.com" target="_self">114</a> <!--最经典的一个网址之一-->
    <!--这个_blank属性值表示会在新的窗口或者标签页打开这个网址(就是把绿宝石放进一个新的箱子里)-->
    <a href="https://simpfun.cn" target="_blank">514</a> <!--公益面板服服务商网址,想和朋友联机又没有预算开服的,这里就是最好的选择之一(我绝对不是在打广告!!!)-->
    <br>
    <!--这个_parent属性值表示会在父窗口或者父框架打开(就是你在箱子里边拿了一个潜影盒并且手持着,你就把绿宝石放进去,如果你拿的是另一个潜影盒那就放在另一个潜影盒里)-->
    <a href="https://github.com" target="_parent">1919</a> <!--代码界的不二之选!-->
    <!--这个属性值表示会在顶层窗口或者顶层框架打开(就是默认把绿宝石放进最上层的潜影盒里)-->
    <a href="https://minecraft.net" target="_top">180</a> <!--考虑支持mc正版的话可以去这里-->
    <hr><!--hr标签会创建一条水平分割线,适合用来划分内容,比如标题和正文的划分-->
    <!--记住了，br是换行标签，而hr是创建水平分割线的标签-->
    <p>而这是一张图片</p>
    <!-- img标签主要用于显示图像文件,可以用它来展示一些比较直观的内容-->
    <img src="just_pictures.jpg" alt="key酱"> <!--src定义了要显示图像文件的路径或者url,可以是相对路径(从当前html文件的位置开始的路径)，绝对路径(开启网页服务器时所在的路径,也就是网页的根目录),也可以是一个url(比如https://localhost:6100/img/omg.jpg),很多浏览器都支持图像的绝大多数格式-->
    <!--至于这个alt属性则是这个图像的替代文本,当图片加载失败时会显示替代文本(相当于图片的代号)-->
    <hr>
    <!--这是相对路径的写法,也可以写成./xxx/...,你得确保这个文件夹或文件与html文件同目录,以及路径或文件名称都填写正确-->
    <img src="img/banana.jpg" alt=""> 
    <!--不然浏览器找半天图片文件找不到会懵逼的(-->
    <hr>
    <!--这是绝对路径的写法,也可以写成~/sss/file.jpg,你得确保路径正确以及文件夹和文件都存在-->
    <img src="/pictures/list/luke.jpg" alt=""> 
    <hr>
    <!--当然我们也会遇到像上面图片一样过于大的问题,我们就可以在img标签中使用width属性来设置这张图片的宽度,以及height属性来设置这张图片的高度-->
    <img src="just_pictures.jpg" alt="" width="300" height="400">
    <!--如果只设置了宽高中的一项的话，那么图片会根据原比例自动调整(推荐)-->
    <!--某些情况下使用百分比会更好-->
    <hr>
    <p>这就不得不提到人们都在避讳的一个事实</p>
    <img src="image/tlsg.jpg" alt="图灵是给" width="700">
    
    <!--div标签通常用于创建一个可以包含其他html元素的容器块(相当于收纳袋),可以利用这个来划分区域和制作更多的界面或副界面(如果后面熟练的话你甚至只需要一个html文件就能达成所有的界面)-->
    <div class="nav">
      
    </div>
  </body>
</html>
